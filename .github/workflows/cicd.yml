name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
      prev_f1: ${{ steps.prev_report.outputs.prev_f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # AWS: secret STORAGE_CREDENTIALS la JSON
        #   {"aws_access_key_id": "...", "aws_secret_access_key": "..."}
        # Tach thanh 2 bien moi truong xac thuc va che (mask) gia tri trong log.
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          AWS_ACCESS_KEY_ID=$(python -c "import json, os; print(json.loads(os.environ['STORAGE_CREDENTIALS'])['aws_access_key_id'])")
          AWS_SECRET_ACCESS_KEY=$(python -c "import json, os; print(json.loads(os.environ['STORAGE_CREDENTIALS'])['aws_secret_access_key'])")
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Detailed evaluation report (Bonus 3)
        run: |
          python - <<'PYEOF'
          import joblib
          import pandas as pd
          from sklearn.metrics import classification_report, confusion_matrix
          df = pd.read_csv("data/holdout.csv")
          X, y = df.drop(columns=["target"]), df["target"]
          preds = joblib.load("models/model.joblib").predict(X)
          tn, fp, fn, tp = confusion_matrix(y, preds).ravel()
          text = "\n".join([
              "Confusion matrix tren holdout (nguong 0.5):",
              "                     du doan 0   du doan 1",
              f"thuc te 0 (<=50K)  {tn:>10}  {fp:>10}",
              f"thuc te 1 (>50K)   {fn:>10}  {tp:>10}",
              "",
              classification_report(y, preds, target_names=["thu_nhap_thap (0)", "thu_nhap_cao (1)"], digits=4),
          ])
          with open("outputs/detail.txt", "w") as f:
              f.write(text)
          print(text)
          PYEOF

      - name: Fetch deployed model report (Bonus 4)
        id: prev_report
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import json, os
          import boto3, botocore
          s3 = boto3.client("s3")
          try:
              obj = s3.get_object(Bucket=os.environ["ARTIFACT_BUCKET"], Key="artifacts/current/report.json")
              prev_f1 = json.loads(obj["Body"].read())["f1_score"]
              print(f"F1 cua model dang trien khai: {prev_f1:.4f}")
          except botocore.exceptions.ClientError as e:
              if e.response["Error"]["Code"] not in ("NoSuchKey", "404"):
                  raise
              prev_f1 = ""
              print("Chua co artifacts/current/report.json -> bo qua so sanh voi model cu.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"prev_f1={prev_f1}\n")
          PYEOF

      - name: Upload candidate model to Cloud Storage
        # Bonus 4: model moi chi la "candidate"; job Release moi chep sang artifacts/current/
        # sau khi qua Quality Gate, nen model kem khong ghi de model dang chay.
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3
          s3 = boto3.client("s3")
          s3.upload_file("models/model.joblib", os.environ["ARTIFACT_BUCKET"], "artifacts/candidate/model.joblib")
          s3.upload_file("outputs/report.json", os.environ["ARTIFACT_BUCKET"], "artifacts/candidate/report.json")
          print("Uploaded candidate model.joblib + report.json successfully")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Dang trien khai model.")
          PYEOF

      - name: Compare with deployed model (Bonus 4)
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          prev = "${{ needs.train.outputs.prev_f1 }}"
          if not prev:
              print(f"Chua co model truoc do tren cloud storage -> cho phep trien khai (F1 moi {f1:.4f}).")
          else:
              prev = float(prev)
              print(f"F1 moi: {f1:.4f} | F1 model dang chay: {prev:.4f} | chenh lech: {f1 - prev:+.4f}")
              if f1 < prev:
                  raise SystemExit(f"ROLLBACK: F1 moi {f1:.4f} < F1 cu {prev:.4f}. Giu model cu, huy trien khai.")
              print("PASSED: F1 moi >= F1 cu. Cho phep trien khai.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Chep model candidate sang artifacts/current/ (Bonus 4) roi trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          AWS_ACCESS_KEY_ID=$(python -c "import json, os; print(json.loads(os.environ['STORAGE_CREDENTIALS'])['aws_access_key_id'])")
          AWS_SECRET_ACCESS_KEY=$(python -c "import json, os; print(json.loads(os.environ['STORAGE_CREDENTIALS'])['aws_secret_access_key'])")
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV

      - name: Promote candidate model to current (Bonus 4)
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          pip install -q boto3
          python - <<'PYEOF'
          import os
          import boto3
          s3 = boto3.client("s3")
          bucket = os.environ["ARTIFACT_BUCKET"]
          for name in ("model.joblib", "report.json"):
              s3.copy_object(Bucket=bucket, Key=f"artifacts/current/{name}",
                             CopySource={"Bucket": bucket, "Key": f"artifacts/candidate/{name}"})
              print(f"Promoted artifacts/candidate/{name} -> artifacts/current/{name}")
          PYEOF

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
